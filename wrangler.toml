# Cloudflare Workers Builds（GitHub 集成）用这个文件部署
name = "workersai2api-d1"
main = "worker.js"
compatibility_date = "2026-11-22"

# 部署时保留 Dashboard 上配置的变量与 Secret
keep_vars = true

# D1 绑定写死在配置里，避免每次部署冲掉 Dashboard 手动绑定
[[d1_databases]]
binding = "DB"
database_name = "workersai2api"
database_id = "b7b497f4-16f8-4a4c-8da2-5a085f8d81c2"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# 被监控的 Worker 名称，按需修改
HEALTH_SCRIPT_NAME = "tc033"
